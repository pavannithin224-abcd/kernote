name: Dependency audit

# Separate from CI on purpose: a newly published advisory should raise a flag,
# not turn the build badge red on a commit that did nothing wrong.
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
  push:
    paths:
      - backend/requirements*.txt
      - frontend/package-lock.json

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pip-audit
      - run: python -m pip_audit -r backend/requirements.txt
