<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 196 48" role="img"
     aria-label="Kernote">
  <title>Kernote</title>
  <!--
    Mark plus wordmark. The mark's own K carries the letter, so the wordmark
    is set in lower case after it and the two are not read as "KKernote":
    the mark is a symbol here, not a capital.

    The text is live, in a system font stack, which is right for the app and
    wrong for anything published: a system stack renders differently on every
    machine. Convert it to outlines before it goes on a site, a README badge
    or a store listing.
  -->
  <g fill="none" stroke="currentColor" stroke-width="5">
    <path d="M14 10 V 38" />
    <path d="M16 24 L 35 11" />
    <path d="M16 24 L 24.8 30.02" />
    <path d="M28.1 32.28 L 35 37" />
  </g>
  <text x="50" y="33" fill="currentColor" font-size="26" font-weight="600"
        letter-spacing="-0.6"
        font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
  >ernote</text>
</svg>
