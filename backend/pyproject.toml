[project]
name = "kernote"
version = "0.1.0"
requires-python = ">=3.12"
description = "Reviewable project memory for developers. Local-first."

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 96
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "C4", "RET", "SIM"]
ignore = ["S101"]  # assert is how tests assert

[tool.ruff.lint.per-file-ignores]
# S105/S106/S108: deliberately fake credentials and temp paths in fixtures.
# S603/S607: test helpers build throwaway git repositories with fixed argument
# lists under tmp_path. Production code's single `git` invocation carries its
# own documented noqa in ingest/gitmeta.py.
"tests/**" = ["S105", "S106", "S108", "S603", "S607"]
